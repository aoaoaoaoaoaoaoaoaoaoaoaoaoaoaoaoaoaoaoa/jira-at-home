[workspace]
members = ["crates/jira-at-home"]
resolver = "3"

[workspace.package]
categories = ["development-tools", "command-line-utilities"]
description = "drooling, braindead issue tracking MCP"
edition = "2024"
keywords = ["mcp", "issues", "notes", "git", "project"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/aoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoa/jira-at-home"
rust-version = "1.97"
version = "1.0.0"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
dirs = "6"
libmcp = { git = "https://github.com/aoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoa/libmcp.git", rev = "98efebdc031f8e2d93fdb56f1382beeb9b19a6e5" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
time = { version = "0.3", features = ["formatting", "serde"] }

[workspace.lints.rust]
warnings = "deny"
elided_lifetimes_in_paths = "deny"
missing_docs = "allow"
unexpected_cfgs = "deny"
unsafe_code = "deny"
unused_crate_dependencies = "deny"
unused_lifetimes = "deny"
unused_qualifications = "deny"
unused_results = "deny"

# House policy: intentional glob vocabularies save tokens; actual ambiguity
# remains a name-resolution error.
ambiguous_glob_imports = "allow"
ambiguous_glob_reexports = "allow"
hidden_glob_reexports = "allow"

# House policy: Unicode identifier appearance is not a human-legibility gate.
confusable_idents = "allow"
mixed_script_confusables = "allow"
uncommon_codepoints = "allow"

[workspace.lints.rustdoc]
bare_urls = "deny"
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -2 }
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -3 }

# House policy: line and parameter counts are not complexity measures.
too_many_arguments = "allow"
too_many_lines = "allow"

# House policy: lexical appearance is not structural correctness.
disallowed_names = "allow"
enum_variant_names = "allow"
similar_names = "allow"
struct_field_names = "allow"
upper_case_acronyms = "allow"

# House policy: source linting cannot adjudicate transitive convergence.
multiple_crate_versions = "allow"

# Internal tooling does not owe boilerplate API documentation.
missing_errors_doc = "allow"
missing_panics_doc = "allow"

dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
allow_attributes_without_reason = "deny"

# House policy: direct and enum-variant glob imports are proper local notation.
enum_glob_use = "allow"
wildcard_imports = "allow"

[workspace.metadata.rust-starter]
format_command = ["cargo", "fmt", "--all", "--check"]
clippy_command = [
  "cargo",
  "clippy",
  "--workspace",
  "--all-targets",
  "--all-features",
]
test_command = ["cargo", "test", "--workspace", "--all-targets", "--all-features"]
doc_command = ["cargo", "doc", "--workspace", "--all-features", "--no-deps"]
fix_command = [
  "cargo",
  "clippy",
  "--fix",
  "--workspace",
  "--all-targets",
  "--all-features",
  "--allow-dirty",
  "--allow-staged",
]

[workspace.metadata.rust-starter.source_files]
max_lines = 2500
include = ["*.rs", "**/*.rs"]
exclude = []
